<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP - Mylanchy Rewards</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #FDF4FF 0%, #FAE8FF 100%); color: #4A5568; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #FFFFFF; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(147, 51, 234, 0.1); width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #7C3AED; margin-bottom: 8px; }
        p { color: #6B7280; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #D8B4FE; border-radius: 10px; box-sizing: border-box; outline: none; text-align: center; font-size: 18px; letter-spacing: 5px; }
        button { width: 100%; background: linear-gradient(135deg, #9333EA 0%, #EC4899 100%); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; }
        .resend-btn { background: #F3E8FF; color: #7C3AED; border: 1px solid #D8B4FE; margin-top: 10px; }
        .resend-btn:hover { background: #E9D5FF; }
        .error { color: #EF4444; font-size: 13px; margin-top: 10px; }
        .msg { color: #10B981; font-size: 13px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Verify OTP</h2>
        <p>Enter the 4-digit code sent to your email</p>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        {% if msg %}<p class="msg">{{ msg }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="otp" placeholder="----" maxlength="4" required>
            <button type="submit">Verify & Continue</button>
        </form>
        <form action="{{ url_for('resend_otp') }}" method="GET">
            <button type="submit" class="resend-btn">Resend OTP</button>
        </form>
    </div>
</body>
</html>
