<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mylanchy Rewards</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #FDF4FF 0%, #FAE8FF 100%); color: #4A5568; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #FFFFFF; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px rgba(147, 51, 234, 0.1); width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #7C3AED; margin-bottom: 8px; }
        p { color: #6B7280; font-size: 14px; margin-bottom: 25px; }
        .btn { display: block; width: 100%; background: linear-gradient(135deg, #9333EA 0%, #EC4899 100%); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; text-decoration: none; margin-bottom: 15px; box-sizing: border-box; transition: 0.3s; }
        .btn-outline { background: white; color: #9333EA; border: 2px solid #9333EA; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <h2>✨ Mylanchy Rewards ✨</h2>
        <p>Scan & Earn Amazing Gifts and Offers!</p>
        <a href="/register" class="btn">New User? Register</a>
        <a href="/login" class="btn btn-outline">Already a User? Login</a>
    </div>
</body>
</html>
