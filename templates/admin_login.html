<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Mylanchy Rewards</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #FDF4FF 0%, #FAE8FF 100%); color: #4A5568; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #FFFFFF; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px rgba(147, 51, 234, 0.1); width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #7C3AED; margin-bottom: 8px; }
        p { color: #6B7280; font-size: 14px; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: 600; font-size: 13px; color: #4B5563; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #D8B4FE; border-radius: 10px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #EC4899; box-shadow: 0 0 5px rgba(236, 72, 153, 0.3); }
        button { width: 100%; background: linear-gradient(135deg, #9333EA 0%, #EC4899 100%); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .error { color: #EF4444; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 Admin Login</h2>
        <p>Mylanchy Shop Owner Panel</p>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter admin username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
