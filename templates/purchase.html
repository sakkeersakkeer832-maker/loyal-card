<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Purchase Amount - Mylanchy Rewards</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #FDF4FF 0%, #FAE8FF 100%); color: #4A5568; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #FFFFFF; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(147, 51, 234, 0.1); width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #7C3AED; margin-bottom: 8px; }
        p { color: #6B7280; font-size: 14px; margin-bottom: 20px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: 600; font-size: 13px; color: #4B5563; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #D8B4FE; border-radius: 10px; box-sizing: border-box; outline: none; font-size: 16px; }
        button { width: 100%; background: linear-gradient(135deg, #9333EA 0%, #EC4899 100%); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Enter Purchase</h2>
        <p>Type the total amount you spent on shopping</p>
        <form method="POST">
            <div class="input-group">
                <label>Amount Spent (₹)</label>
                <input type="number" step="0.01" name="amount" placeholder="e.g. 450" required>
            </div>
            <button type="submit">Submit Purchase</button>
        </form>
    </div>
</body>
</html>
